[project]
name = "finance-a2a-api"
version = "0.1.0"
description = "Finance agent's published A2A-shaped contract (the only code shared between teams)"
requires-python = ">=3.12,<3.13"
dependencies = ["nexus-rpc>=1.1.0,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_a2a_api"]
