[project]
name = "demo-testing"
version = "0.1.0"
description = "Test-only helpers: two-namespace dev-server fixtures, ScriptedModel, history helpers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "temporalio>=1.34.0,<2",
    "temporalio-strands-agents>=0.1.0",
    "strands-agents>=1.39.0",
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "finance-a2a-api",
    "httpx>=0.27",
    "boto3>=1.35",
]

[tool.uv.sources]
finance-a2a-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo_testing"]
