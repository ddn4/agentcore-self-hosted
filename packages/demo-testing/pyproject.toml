[project]
name = "demo-testing"
version = "0.1.0"
description = "Test-only helpers: two-namespace dev-server fixtures (later: ScriptedModel, history assertions)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "temporalio>=1.34.0,<2",
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo_testing"]
