# EKS-only values (plan v0.11, runbook 2.1-2.5, 3, 4.1). Last in the values order:
#   -f values.postgresql.yaml -f values.base.yaml -f values.tls.yaml -f values.eks.yaml \
#   -f .generated/values.eks.ids.yaml
# "Same values, different backend": values.postgresql/base/tls are the v0.9 files, unchanged.
# The last file is GENERATED by `make eks-temporal` (scripts/eks.sh) from
# .generated/foundation.json (gitignored): the RDS address and the temporal-server-wci role ARN
# carry resource / account IDs and never go into git. The placeholders below make a forgotten
# generated file fail loudly (an .invalid host, no IRSA annotation).
server:
  config:
    persistence:
      numHistoryShards: 512          # plan 3.3 / ADR-0006; IMMUTABLE after the first start
      datastores:
        default:
          sql:
            connectAddr: "rds-address-from-make-render-config.invalid:5432"
            user: temporal_user        # scripts/create-db-user.sh (CREATEDB, owns both databases)
            existingSecret: temporal-db-secret
            secretKey: password
            # Runbook 2.2: RDS forces TLS (rds.force_ssl=1, v0.10); verify the chain AND the host
            # name against the official us-east-1 bundle (Secret rds-ca, `make eks-rds-ca`).
            tls:
              enabled: true
              caFile: /etc/temporal/rds-ca/rds-ca.pem
              enableHostVerification: true
        visibility:
          sql:
            connectAddr: "rds-address-from-make-render-config.invalid:5432"
            user: temporal_user
            existingSecret: temporal-db-secret
            secretKey: password
            tls:
              enabled: true
              caFile: /etc/temporal/rds-ca/rds-ca.pem
              enableHostVerification: true
  # The RDS CA for every server pod (runbook 2.2).
  additionalVolumes:
    - name: rds-ca
      secret: { secretName: rds-ca }
  additionalVolumeMounts:
    - { name: rds-ca, mountPath: /etc/temporal/rds-ca, readOnly: true }
  # Runbook 2.4: the frontend behind an INTERNAL TCP NLB (AWS Load Balancer Controller 3.6.2),
  # ip targets, TLS passed straight through to the pods (no aws-load-balancer-ssl-cert: the
  # frontend must see the client certificate). The NLB carries the Terraform-managed SG
  # agentcore-demo-nlb-temporal-frontend (matched by its Name tag; 7233 from the AgentCore SG and
  # the EKS nodes); the LBC adds the NLB -> pod rules to the node SG. Annotation names and values:
  # kubernetes-sigs.github.io/aws-load-balancer-controller/latest/guide/service/annotations/
  # (read 2026-10-31). preserve_client_ip defaults to disabled for ip targets, so the pods see
  # the NLB's private IPs (allowed by the generated NetworkPolicy temporal-frontend-from-nlb).
  # The chart puts both ports of the Service (7233 gRPC, 7243 HTTP) on the NLB; the SG admits 7233 only.
  # v0.12: cross-zone load balancing ON. The NLB has a node in each of the 3 subnets and its DNS
  # (client_routing_policy any_availability_zone) hands out all 3 IPs, but the 2 frontend pods sit
  # in 2 AZs. With cross-zone off (the NLB default) a client that picks the third AZ's node gets
  # its SYNs dropped: the first AgentCore session (ENI in another AZ, NLB node without targets)
  # timed out connecting. In-cluster tests from the two pod AZs did not show it. Annotation per the
  # LBC guide above ("enable cross zone load balancing", read 2026-10-31).
  frontend:
    replicaCount: 2
    podDisruptionBudget: { minAvailable: 1 }
    resources: { requests: { cpu: 200m, memory: 256Mi }, limits: { memory: 1Gi } }
    service:
      type: LoadBalancer
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-type: external
        service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
        service.beta.kubernetes.io/aws-load-balancer-scheme: internal
        service.beta.kubernetes.io/aws-load-balancer-name: temporal-frontend
        service.beta.kubernetes.io/aws-load-balancer-security-groups: agentcore-demo-nlb-temporal-frontend
        service.beta.kubernetes.io/aws-load-balancer-manage-backend-security-group-rules: "true"
        service.beta.kubernetes.io/aws-load-balancer-attributes: load_balancing.cross_zone.enabled=true
        service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: Project=agentcore-self-hosted,Stack=v0.11-helm
  history:
    resources: { requests: { cpu: 300m, memory: 768Mi }, limits: { memory: 2Gi } }
  matching:
    resources: { requests: { cpu: 200m, memory: 256Mi }, limits: { memory: 1Gi } }
  # Runbook 4.1: IRSA on the worker service ONLY (it runs the WCI). The trust of
  # temporal-server-wci names exactly system:serviceaccount:temporal:temporal-worker (v0.10);
  # the role-arn annotation comes from the generated file. Every other component keeps the
  # global ServiceAccount (namespace default SA), without the annotation.
  worker:
    resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 1Gi } }
    serviceAccount:
      create: true
      name: temporal-worker
admintools:
  # The schema Job and the namespace Job mount admintools.additionalVolumes (chart 1.7.0
  # templates/server-job.yaml; ledger 30), not server.additionalVolumes: the RDS CA goes in both.
  additionalVolumes:
    - name: rds-ca
      secret: { secretName: rds-ca }
  additionalVolumeMounts:
    - { name: rds-ca, mountPath: /etc/temporal/rds-ca, readOnly: true }
web:
  resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }
