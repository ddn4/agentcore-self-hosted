# kind-only values (plan v0.9). Last in the values order.
server:
  config:
    persistence:
      numHistoryShards: 4     # plan 3.3: kind 4. Immutable.
  # One replica each (chart default), small requests so everything fits the colima VM
  # (6 CPU / 12 GB).
  frontend:
    resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 1Gi } }
  history:
    resources: { requests: { cpu: 200m, memory: 512Mi }, limits: { memory: 2Gi } }
  matching:
    resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 1Gi } }
  worker:
    resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 1Gi } }
web:
  resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }
