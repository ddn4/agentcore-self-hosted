# Runbook 7b.3. On EKS the overlay adds the IRSA annotation (role agent-services-worker,
# Bedrock only). On kind there is no IRSA: AWS credentials come from the optional
# Secret aws-creds (make kind-aws-creds), or the scripted model runs (no AWS).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-services-worker
  namespace: temporal-workers
