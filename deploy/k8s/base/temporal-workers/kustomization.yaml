# Team Finance's runtime on Kubernetes (runbook 7b.1-7b.7), used by overlays/kind and
# overlays/kind-scripted. Images are bare names; overlays set name/tag.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - certificate.yaml
  - serviceaccount.yaml
  - finance-worker.yaml
  - payments-mock.yaml
  - networkpolicy.yaml
