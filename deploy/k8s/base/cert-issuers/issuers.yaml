# Runbook 2.6 step 2, verbatim: a free cert-manager CA in the cluster.
# SelfSigned bootstrap -> root CA Certificate (Secret cert-manager/temporal-root-ca) ->
# CA ClusterIssuer `temporal-ca` that signs every Temporal and Worker certificate and
# writes the root into each Secret's ca.crt. Never generated by Terraform (ADR-0007):
# the root key lives only in this Secret (accepted risk, ADR-0007).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata: { name: selfsigned-bootstrap }
spec: { selfSigned: {} }
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: { name: temporal-root-ca, namespace: cert-manager }   # ClusterIssuer CA secrets live in the cert-manager namespace
spec:
  isCA: true
  commonName: temporal-customer-support Root CA
  secretName: temporal-root-ca
  duration: 87600h                       # 10 years; rotating the root means re-issuing everything
  privateKey: { algorithm: ECDSA, size: 256 }
  issuerRef: { name: selfsigned-bootstrap, kind: ClusterIssuer, group: cert-manager.io }
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata: { name: temporal-ca }
spec:
  ca: { secretName: temporal-root-ca }
