# gitleaks config: the default rules, plus one allowlist.
#
# Replay fixtures (tests/histories/*.json, and the compact console fixtures in
# services/demo-console/tests/fixtures/*.json) carry Nexus operation tokens. They are
# server-issued routing tokens, base64url JSON such as
# {"t":1,"ns":"agent-services","wid":"a2a-task-support-1042"}: no credential, but
# long and high-entropy, so the generic-api-key rule flags them.
#
# The regex below matches the dummy AWS key in commit 08f8ba9 (v0.2,
# test_wire_offline.py; also named in scripts/scrub-check.sh). History is never
# rewritten; scrub-check's grep still rejects it in the tree (hence no literal here).
[extend]
useDefault = true

[allowlist]
description = "Nexus operation tokens in replay fixtures; the v0.2 dummy AWS key"
regexTarget = "line"
regexes = [
  '''"(operationToken|nexus-operation-token)":\s*"eyJ[A-Za-z0-9_-]+=*"''',
  '''AKIAOFFLINE[T]EST0{5}''',
]
