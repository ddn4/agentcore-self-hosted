# gitleaks config: the default rules, plus one allowlist.
#
# Replay fixtures (tests/histories/*.json) carry Nexus operation tokens. They are
# server-issued routing tokens, base64url JSON such as
# {"t":1,"ns":"agent-services","wid":"a2a-task-support-1042"}: no credential, but
# long and high-entropy, so the generic-api-key rule flags them.
[extend]
useDefault = true

[allowlist]
description = "Nexus operation tokens in replay fixtures (base64url JSON, not secrets)"
regexTarget = "line"
regexes = [
  '''"(operationToken|nexus-operation-token)": "eyJ[A-Za-z0-9_-]+=*"''',
]
