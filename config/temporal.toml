# Temporal envconfig profiles (TEMPORAL_CONFIG_FILE=config/temporal.toml).
# Select one with TEMPORAL_PROFILE. Read by both the Temporal CLI and the
# Python SDK (temporalio.envconfig). Addresses, server names and cert PATHS
# only: never inline cert or key data here.
#
# No profile sets a namespace: each service defaults to its own (agents or
# agent-services) in code, and CLI commands pass --namespace explicitly.
# Env vars (TEMPORAL_ADDRESS, TEMPORAL_NAMESPACE, TEMPORAL_TLS...) override.

# Laptop dev server (make dev-server). 127.0.0.1, not localhost: localhost can
# resolve to ::1 while the dev server binds only 127.0.0.1.
[profile.local]
address = "127.0.0.1:7233"

[profile.local.tls]
disabled = true

# kind (v0.9): the Helm-installed server on the local kind cluster, reached through
# `make pf` (kubectl port-forward 127.0.0.1:7233 -> svc/temporal-frontend), with mTLS.
# The Route 53 name is checked as the TLS server name (SNI + SAN), exactly as an
# AgentCore Worker will on EKS; the address stays 127.0.0.1 so no /etc/hosts entry is
# needed (optional: `127.0.0.1 temporal-frontend.temporal-customer-support.internal`).
# Paths are relative to the repo root (every make target runs there); the files come
# from `make certs-pull` (.certs/ is gitignored). Identity: the `operator` cert (CLI,
# demo scripts). Support's Workers override the client cert with their own via
# TEMPORAL_TLS_CLIENT_CERT_PATH / _KEY_PATH (Makefile, TEMPORAL_PROFILE=kind).
[profile.kind]
address = "127.0.0.1:7233"

[profile.kind.tls]
server_name = "temporal-frontend.temporal-customer-support.internal"
server_ca_cert_path = ".certs/ca.crt"
client_cert_path = ".certs/operator/tls.crt"
client_key_path = ".certs/operator/tls.key"

# kind before mTLS (plan v0.9 commit 1: `make kind-temporal KIND_TLS=0`).
[profile.kind-plaintext]
address = "127.0.0.1:7233"

[profile.kind-plaintext.tls]
disabled = true

# eks-pf (v0.11): the Helm-installed server on EKS (RDS, internal NLB), reached from the laptop
# through `make pf TEMPORAL_PROFILE=eks-pf` (kubectl port-forward 127.0.0.1:7233 ->
# svc/temporal-frontend on EKS), with mTLS from the EKS cluster's own cert-manager CA. Same
# shape as `kind`: dial 127.0.0.1, check the Route 53 name (SNI + SAN). Files from
# `make certs-pull TEMPORAL_PROFILE=eks-pf` (.certs/eks/, gitignored). Identity: `operator`;
# the laptop Support Worker overrides it with `laptop-support` (Makefile, TEMPORAL_PROFILE=eks-pf).
[profile.eks-pf]
address = "127.0.0.1:7233"

[profile.eks-pf.tls]
server_name = "temporal-frontend.temporal-customer-support.internal"
server_ca_cert_path = ".certs/eks/ca.crt"
client_cert_path = ".certs/eks/operator/tls.crt"
client_key_path = ".certs/eks/operator/tls.key"
