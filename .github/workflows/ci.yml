# CI: `make check` with no AWS credentials, plus gitleaks over the full history.
# First run 2026-10-30, after the GitHub remote was added.
# v0.9: `make infra-static` (helm template + kustomize -> kubeconform) is part of make check;
# kubeconform comes from `make tools` (pinned sha256), helm/kubectl from the runner image.
# v0.8: terraform fmt -check / validate (-backend=false) / tflint over infra/terraform
# (`make tf-static`; terraform 1.17.0 and tflint v0.64.0 from `make tools`, pinned sha256).
# No AWS credentials anywhere in CI: validate needs only the provider download.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  TEMPORAL_CLI_VERSION: "1.9.1"   # keep in sync with docs/versions.md
  PYTHON_VERSION: "3.12"

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Temporal CLI ${{ env.TEMPORAL_CLI_VERSION }}
        run: |
          curl -sSfL -o /tmp/temporal.tgz \
            "https://github.com/temporalio/cli/releases/download/v${TEMPORAL_CLI_VERSION}/temporal_cli_${TEMPORAL_CLI_VERSION}_linux_amd64.tar.gz"
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/temporal.tgz -C "$HOME/.local/bin" temporal
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show versions
        run: |
          temporal --version
          uv --version

      - name: Sync workspace
        run: |
          uv python install "${PYTHON_VERSION}"
          uv sync --all-packages --frozen

      - name: Doctor (no AWS)
        env:
          DOCTOR_SKIP_AWS: "1"
        run: make doctor

      - name: Tools (kubeconform, terraform, tflint)
        run: |
          make tools
          helm version --short
          kubectl version --client

      # The time-skipping tests start the SDK's test server, which the SDK downloads from
      # temporal.download into the temp dir and reuses. The first CI run got a 429 there:
      # cache the binary per SDK version, and fetch it once up front with retries.
      - name: Cache the Temporal test server
        uses: actions/cache@v4
        with:
          path: /tmp/temporal-test-server-sdk-python-*
          key: temporal-test-server-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Fetch the Temporal test server (retries on 429)
        run: |
          for attempt in 1 2 3 4 5; do
            uv run --frozen python -c 'import asyncio
          from temporalio.testing import WorkflowEnvironment
          async def main():
              env = await WorkflowEnvironment.start_time_skipping()
              await env.shutdown()
          asyncio.run(main())' && exit 0
            echo "attempt $attempt failed; retrying in $((attempt * 20)) s"
            sleep $((attempt * 20))
          done
          exit 1

      - name: make check
        run: make check

      # v0.8: every Terraform stack, statically (no backend, no credentials).
      - name: Terraform static (fmt, validate, tflint)
        run: make tf-static

      # v0.7: the AgentCore CodeZip bundle imports and serves in a fresh 3.12 venv, and is
      # under 250 MB zipped for linux arm64 (needs PyPI, no AWS).
      - name: AgentCore bundle
        run: make agentcore-bundle agentcore-bundle-test

      # v0.9: the images the kind/EKS overlays run (build context = the uv workspace).
      - name: Docker builds (Finance, payments-mock)
        run: |
          docker build -f services/finance-agent/Dockerfile --target finance -t finance-agent:ci .
          docker build -f services/finance-agent/Dockerfile --target finance-scripted -t finance-agent:ci-scripted .
          docker build -f services/payments-mock/Dockerfile -t payments-mock:ci .
          docker run --rm finance-agent:ci python -c "import finance_agent.worker, finance_a2a_api"

  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: scrub-check over history
        run: scripts/scrub-check.sh --history
