[[scenario]]
id = "failure"
title = "Finance disappears mid-call"
summary = "The Finance worker goes away; Support's Nexus call retries until it comes back."
story = { tag = "v0.11-temporal-and-finance-on-eks", doc = "docs/story/v0.11-temporal-and-finance-on-eks.md" }
profiles = ["local", "eks-pf"]
case = "A"
order_id = "1042"
amount_usd = 40.0
id_prefix = "support-1042-failure"
queue = "dev"
cost = { local = "free", kind = "free", kind-plaintext = "free", eks-pf = "aws" }
cost_note = "locally: stops the managed Finance worker; on EKS: kubectl scale (AWS)"
preconditions = ["temporal", "endpoint", "finance-managed", "payments", "support-plain"]
notes = "Finance's team has an outage. Support's call doesn't fail: the server keeps the Nexus operation and retries it. When Finance comes back, the answer arrives."

  [[scenario.step]]
  id = "start"
  title = "Start Case A"
  kind = "action"
  action = "start-run"
  done_when = "run.started"
  talk = "Case A again."
  make = "make case-a WF={wf}"

  [[scenario.step]]
  id = "card"
  title = "Discovery completes"
  kind = "watch"
  done_when = "card.discovered"
  talk = "Discovery is synchronous: Finance must be up for it."

  [[scenario.step]]
  id = "stop-finance"
  title = "Stop Finance"
  kind = "action"
  action = "process.stop"
  params = { name = "worker-finance", signal = "TERM" }
  done_when = "process.worker-finance==stopped"
  talk = "Finance goes away. Nobody polls agent-services-tq."
  make = "make failure WF={wf} TEMPORAL_PROFILE=eks-pf"

  [[scenario.step]]
  id = "retrying"
  title = "The Nexus call retries"
  kind = "watch"
  done_when = "nexus.attempt>=2"
  talk = "Attempt 2, 3... with the last failure. Nothing fails on Support's side."
  make = "make pending WF={wf}"

  [[scenario.step]]
  id = "start-finance"
  title = "Start Finance again"
  kind = "action"
  action = "process.start"
  params = { name = "worker-finance" }
  done_when = "nexus.completed"
  talk = "Finance is back and the operation completes."

  [[scenario.step]]
  id = "reply"
  title = "Support replies"
  kind = "watch"
  done_when = "run.closed"
  talk = "The customer never knew."

