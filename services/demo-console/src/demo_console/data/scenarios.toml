[[scenario]]
id = "failure"
title = "Finance outage: Finance disappears mid-call"
short = "Finance outage"
sub = "Finance goes away; Nexus retries"
run_label = "Case A, Finance outage"
summary = "The Finance worker goes away; Support's Nexus call retries until it comes back."
story = { tag = "v0.5-a2a-over-nexus", doc = "docs/story/v0.5-a2a-over-nexus.md" }
