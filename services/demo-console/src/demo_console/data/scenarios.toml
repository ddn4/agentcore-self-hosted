case = "A"
order_id = "1042"
amount_usd = 40.0
id_prefix = "support-1042-failure"
queue = "dev"
next = "serverless-b"
start_label = "Start Case A"
cost = { local = "free" }
cost_note = "stops and restarts the console-managed Finance worker"
preconditions = ["temporal", "endpoint", "finance-managed", "payments", "support-plain"]
notes = "Finance's team has an outage. Support's call doesn't fail: the server keeps the Nexus operation and retries it. When Finance comes back, the answer arrives."

  [[scenario.step]]
  id = "start"
  title = "Start Case A"
  short = "Start"
  point = "The ticket at the top, and the first rows in Support's lane."
  kind = "action"
  action = "start-run"
  done_when = "run.started"
  talk = "Case A again."
