  [[scenario.step]]
  id = "card"
  title = "Discovery completes"
  short = "Agent Card"
  point = "The short wire to the seam: get_agent_card, the one thing Finance publishes."
  kind = "watch"
  done_when = "card.discovered"
  talk = "Discovery is synchronous: Finance must be up for it."

  [[scenario.step]]
  id = "stop-finance"
  title = "Stop Finance"
  short = "Stop Finance"
  point = "Finance's pip in the stack bar goes down."
  kind = "action"
  action = "process.stop"
  params = { name = "worker-finance", signal = "TERM" }
