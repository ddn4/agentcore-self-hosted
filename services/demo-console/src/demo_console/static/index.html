<script>
  // Theme and layout flags before first paint (no flash). Storage may be blocked: ignore.
  // Dark is the default whatever the OS prefers (docs/console/BRAND.md); light only when chosen.
  (function () {
    var d = document.documentElement, q = new URLSearchParams(location.search), s = {};
    try { s = JSON.parse(localStorage.getItem("console.ui") || "{}") || {}; } catch (e) { s = {}; }
    d.dataset.theme = (q.get("theme") || s.theme) === "light" ? "light" : "dark";
    d.dataset.projector = q.get("projector") || s.projector || "off";
    // On the projector the notes are off unless turned on there (they belong on #/notes).
    d.dataset.notes = q.get("notes") || (d.dataset.projector === "on" ? s.projectorNotes || "off" : s.notes || "on");
  })();
</script>
<script type="module" src="app.js"></script>
