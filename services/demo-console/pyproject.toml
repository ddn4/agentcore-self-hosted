[project]
name = "demo-console"
version = "0.1.0"
description = "Demo console: drive and watch every scenario of the demo on http://127.0.0.1:8099 (docs/console/DESIGN.md)"
requires-python = ">=3.12,<3.13"
# Every third-party dependency here is already in uv.lock (starlette and uvicorn come in through
# bedrock-agentcore and mcp; httpx through finance-agent and demo-testing): no new download.
dependencies = [
    "starlette>=1.10,<2",
    "uvicorn>=0.54",
    "httpx>=0.27",
    "temporalio>=1.34.0,<2",
    "finance-a2a-api",
    "demo-testing",
]

[tool.uv.sources]
finance-a2a-api = { workspace = true }
demo-testing = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo_console"]
