[project]
name = "support-agent"
version = "0.1.0"
description = "Team Support: Support Supervisor agent (namespace agents; runs on AgentCore)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "temporalio>=1.34.0,<2",
    "temporalio-strands-agents>=0.1.0",
    "strands-agents>=1.39.0",
    "bedrock-agentcore>=1.9.1",
    "boto3>=1.34.92,<2",
    "finance-a2a-api",
]

[tool.uv.sources]
finance-a2a-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_agent"]
